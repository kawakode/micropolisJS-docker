# Publishes KawaCity's Docker image to the GitHub Container Registry when a tag is pushed:
#
#   git tag v1.2.3
#   git push origin v1.2.3
#
# The tests run first. The image, for amd64 and arm64, is then published as ghcr.io/<owner>/kawacity with the tag's
# name. A version tag (v1.2.3 or 1.2.3) is also published as 1.2.3 and 1.2 (and 1 from version 1 on), and moves
# latest unless it is a pre-release (v1.2.3-rc.1).

name: Publish the Docker image

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint

  publish:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # Image names must be in lower case; latest only follows stable versions
      - name: Name the image
        id: image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kawacity" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        env:
          # So that the registry shows the description of the multi-platform image
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') && !startsWith(github.ref_name, '0.') }}
            type=raw,value=latest,enable=${{ steps.image.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.title=KawaCity
            org.opencontainers.image.description=KawaCity, a city simulation game for the browser, served by nginx on port 80
          annotations: |
            org.opencontainers.image.title=KawaCity
            org.opencontainers.image.description=KawaCity, a city simulation game for the browser, served by nginx on port 80

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Shown in the game's About page, and used to refresh the browser's cache
          build-args: BUILD_ID=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
