# nginx in front of KawaCity, with TLS: an example to adapt (the name, the certificate's paths).
#
# KawaCity then runs with PUBLIC_URL=https://kawacity.example.com and TRUST_PROXY=1, and its port is published on
# this host only ("127.0.0.1:8080:8080" in docker-compose.yml), so that nobody can reach it without going through
# nginx.

# WebSocket upgrades (multiplayer) pass through; other requests keep their connection
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name kawacity.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kawacity.example.com;

    ssl_certificate     /etc/letsencrypt/live/kawacity.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kawacity.example.com/privkey.pem;

    server_tokens off;

    # City uploads are at most 1 MiB of JSON
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # The address nginx was connected from is appended: with TRUST_PROXY=1, KawaCity reads that one
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Longer than the game's WebSocket pings (every 25 s)
        proxy_read_timeout 60s;
    }
}
